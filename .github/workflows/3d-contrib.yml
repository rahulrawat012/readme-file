name: GitHub 3D Contribution Calendar

on:
  schedule:
    # 18:00 UTC = 23:30 IST every day
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib-calendar
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: rahulrawat012
      - name: Commit & Push changes
        run: |
          git config user.name rahulrawat012
          git config user.email rahulrawat012@users.noreply.github.com
          git add -A .
          git commit -m "Generated 3D contribution graph" || exit 0
          git push
